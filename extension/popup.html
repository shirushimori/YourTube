<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YourTube</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>YourTube</h1>

  <div class="field">
    <label>URL</label>
    <input type="text" id="url" placeholder="https://youtube.com/watch?v=...">
  </div>

  <div class="field">
    <label>Download Type</label>
    <div class="radios">
      <label><input type="radio" name="dl_type" value="video_audio" checked> Video + Audio</label>
      <label><input type="radio" name="dl_type" value="video_only"> Video only</label>
      <label><input type="radio" name="dl_type" value="audio_only"> Audio only</label>
    </div>
  </div>

  <div class="field">
    <label>Quality</label>
    <select id="quality">
      <option value="2160">2160p (4K)</option>
      <option value="1440">1440p (2K)</option>
      <option value="1080" selected>1080p</option>
      <option value="720">720p</option>
      <option value="480">480p</option>
      <option value="360">360p</option>
    </select>
  </div>

  <div class="field">
    <label>Save to</label>
    <input type="text" id="output-dir" value="/home/mori/Videos">
  </div>

  <button id="go-btn">Fetch Info</button>

  <div id="status" class="hidden"></div>

  <script src="popup.js"></script>
</body>
</html>
